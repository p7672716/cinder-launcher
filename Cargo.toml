[package]
name = "cinder-launcher"
default-run = "cinder-launcher"
version = "0.0.1"
edition = "2024"

[dependencies]
gpui-kit = "=0.8.1"
uuid = { version = "1", features = ["v4"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
webbrowser = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials"] }
